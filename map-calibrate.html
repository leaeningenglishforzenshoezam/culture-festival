<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>市商祭 MAP 座標調整</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin:
        0
        0
        8px;

      font-size: 24px;
    }

    .description {
      margin-bottom: 20px;

      color: #666;

      font-size: 14px;
    }

    .controls {
      position: sticky;
      top: 0;

      z-index: 100;

      margin-bottom: 16px;

      padding: 14px;

      border-radius: 14px;

      background:
        rgba(255,255,255,0.96);

      box-shadow:
        0
        6px
        18px
        rgba(0,0,0,0.10);
    }

    .target-buttons {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(70px, 1fr));

      gap: 7px;
    }

    .target-button {
      padding:
        9px
        5px;

      border:
        1px solid #ddd;

      border-radius: 9px;

      background: #fff;

      font-size: 13px;
      font-weight: 800;

      cursor: pointer;
    }

    .target-button.active {
      color: #fff;
      background: #222;
    }

    .current {
      margin-top: 12px;

      font-size: 14px;
      font-weight: 800;
    }

    .map-wrap {
      position: relative;

      width: 100%;

      max-width: 1200px;

      margin: 0 auto;

      background: #fff;

      border:
        2px solid #222;
    }

    .map-wrap img {
      display: block;

      width: 100%;
      height: auto;

      user-select: none;
      -webkit-user-drag: none;
    }

    .marker {
      position: absolute;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      background: #ff2d55;

      border:
        3px solid #fff;

      box-shadow:
        0
        0
        0
        2px #ff2d55;

      transform:
        translate(-50%, -50%);

      pointer-events: none;
    }

    .result-box {
      max-width: 1200px;

      margin:
        18px
        auto
        0;

      padding: 16px;

      border-radius: 14px;

      background: #fff;

      box-shadow:
        0
        6px
        18px
        rgba(0,0,0,0.08);
    }

    .result-box h2 {
      margin:
        0
        0
        10px;

      font-size: 18px;
    }

    textarea {
      width: 100%;
      min-height: 300px;

      padding: 12px;

      border:
        1px solid #ccc;

      border-radius: 10px;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;

      font-size: 13px;

      resize: vertical;
    }

    .copy-button {
      margin-top: 10px;

      width: 100%;

      padding: 12px;

      border: 0;

      border-radius: 10px;

      color: #fff;
      background: #222;

      font-size: 14px;
      font-weight: 800;

      cursor: pointer;
    }

    .copy-message {
      margin-top: 8px;

      color: #168344;

      font-size: 12px;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <h1>
    市商祭 MAP 座標調整
  </h1>

  <p class="description">
    対象を選び、地図上の正しい位置をクリックしてください。
  </p>


  <div class="controls">

    <div
      class="target-buttons"
      id="targetButtons"
    ></div>

    <div class="current">
      選択中：
      <span id="currentTarget">
        1A
      </span>
    </div>

  </div>


  <div
    class="map-wrap"
    id="mapWrap"
  >

    <img
      src="images/gallery/map.jpg"
      alt="市商祭配置図"
      id="mapImage"
    >

  </div>


  <div class="result-box">

    <h2>
      取得した座標
    </h2>

    <textarea
      id="resultText"
      readonly
    ></textarea>

    <button
      type="button"
      class="copy-button"
      id="copyButton"
    >
      座標をコピー
    </button>

    <div
      class="copy-message"
      id="copyMessage"
    ></div>

  </div>


  <script>

    const targets = [
      "1A",
      "1B",
      "1C",
      "1D",
      "1E",

      "2A",
      "2B",
      "2C",
      "2D",
      "2E",

      "3A",
      "3B",
      "3C",
      "3D",
      "3E",

      "1年生共同展示",

      "美術部",
      "家庭部",
      "茶道部",
      "同窓会",
      "PTA",
      "生徒会",
      "大和国際日本語学院",
      "アカペラ部",
      "華道部",
      "書道部"
    ];


    let currentTarget = "1A";

    const coordinates = {};


    const targetButtons =
      document.getElementById(
        "targetButtons"
      );


    const currentTargetElement =
      document.getElementById(
        "currentTarget"
      );


    const mapWrap =
      document.getElementById(
        "mapWrap"
      );


    const mapImage =
      document.getElementById(
        "mapImage"
      );


    const resultText =
      document.getElementById(
        "resultText"
      );


    const copyButton =
      document.getElementById(
        "copyButton"
      );


    const copyMessage =
      document.getElementById(
        "copyMessage"
      );



    /* =========================
       BUTTONS
    ========================== */

    targets.forEach(
      (target, index) => {

        const button =
          document.createElement(
            "button"
          );


        button.type =
          "button";


        button.className =
          "target-button";


        button.textContent =
          target;


        if (index === 0) {

          button.classList.add(
            "active"
          );

        }


        button.addEventListener(
          "click",
          () => {

            currentTarget =
              target;


            currentTargetElement.textContent =
              target;


            document
              .querySelectorAll(
                ".target-button"
              )
              .forEach(
                (btn) => {

                  btn.classList.remove(
                    "active"
                  );

                }
              );


            button.classList.add(
              "active"
            );

          }
        );


        targetButtons.appendChild(
          button
        );

      }
    );



    /* =========================
       MAP CLICK
    ========================== */

    mapWrap.addEventListener(
      "click",
      (event) => {

        const rect =
          mapImage.getBoundingClientRect();


        const x =
          (
            (
              event.clientX -
              rect.left
            )
            /
            rect.width
          )
          *
          100;


        const y =
          (
            (
              event.clientY -
              rect.top
            )
            /
            rect.height
          )
          *
          100;


        coordinates[
          currentTarget
        ] = {

          x:
            Number(
              x.toFixed(2)
            ),

          y:
            Number(
              y.toFixed(2)
            )

        };


        updateMarker(
          currentTarget,
          x,
          y
        );


        updateResults();

      }
    );



    /* =========================
       MARKER
    ========================== */

    function updateMarker(
      target,
      x,
      y
    ) {

      let marker =
        document.querySelector(
          `[data-marker="${target}"]`
        );


      if (!marker) {

        marker =
          document.createElement(
            "div"
          );


        marker.className =
          "marker";


        marker.dataset.marker =
          target;


        mapWrap.appendChild(
          marker
        );

      }


      marker.style.left =
        `${x}%`;


      marker.style.top =
        `${y}%`;

    }



    /* =========================
       RESULTS
    ========================== */

    function updateResults() {

      let text = "";


      targets.forEach(
        (target) => {

          const point =
            coordinates[
              target
            ];


          if (!point) {

            return;

          }


          text +=
            `${target}: x: ${point.x}, y: ${point.y}\n`;

        }
      );


      resultText.value =
        text;

    }



    /* =========================
       COPY
    ========================== */

    copyButton.addEventListener(
      "click",
      async () => {

        try {

          await navigator.clipboard.writeText(
            resultText.value
          );


          copyMessage.textContent =
            "コピーしました。";


          setTimeout(
            () => {

              copyMessage.textContent =
                "";

            },
            2000
          );

        }

        catch (error) {

          resultText.select();

          document.execCommand(
            "copy"
          );


          copyMessage.textContent =
            "コピーしました。";

        }

      }
    );

  </script>

</body>

</html>
